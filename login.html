<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mewar Meals - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card">

        <h1 class="login-h1">Mewar Meals</h1>
        <p class="login-subtitle">Taste of Rajasthan</p>

        <form id ="loginform" autocomplete="off">

            <label class="login-label" for="email-login">Email</label>
            <input class="login-input" type="email" id="email-login" placeholder="Enter your email" required>

            <label class="login-label" for="password-login">Password</label>
            <input class="login-input" type="password" id="password-login" placeholder="Enter password" required>

            <button class="login-button" type="submit">Sign In</button>

            <p class="login-register">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </form>

    </div>

</div>
<script src="script.js"></script>
</body>
</html>
