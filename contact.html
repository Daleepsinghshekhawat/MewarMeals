<!DOCTYPE html>
<html>
<head>
    <title>Contact | MewarMeals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <h1 class="logo">MewarMeals</h1>
</header>

<section class="section" style="text-align:center">
    <h3>Contact Us</h3>
    <form class="contact-form">
        <label for="user"> Your Name</label><br>
        <input type="text" id="user" placeholder="Your Name" name="username"><br>

        <label for="email">Email Address</label><br>
        <input type="email" id="email" placeholder="Your Email" name="useremail">
           <br>
        <textarea placeholder="Message"></textarea>
        <button>Send</button>
    </form>
</section>

</body>
</html>
